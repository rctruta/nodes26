  - id: prior_report_issue
    claim: "155"
    context: "upstream issue describing poisoning through reused entity names"
    status: verified
    source: "gh issue view 155 --repo neo4j-labs/agent-memory --json title"
    check: shell
    expect: "graph-memory poisoning"

  - id: search_threshold
    claim: "0.7"
    context: "primary entity and message search threshold"
    status: verified
    source: "experiments/catalog_lamp.json"
    grep: "0.7,"

# Claims that were fabricated once. These BLOCK a commit.
# Add a pattern the moment a wrong number is found in the wild:
#   - pattern: "416"
#     reason: "Fabricated run count. Real figure: 110+."
banned: []

# Lines that legitimately MENTION a banned pattern in order to warn about it
# (retraction notes, crib sheets). Keeps the gate honest without muting it:
#   - file: NOTES.md
#     contains: "filed by other"
#     reason: "Explicitly records that these are not ours."
allow: []
