    status: verified
    source: "results/20261111T161252Z/copies-expanded-agent-short_term-2.json"
    grep: "Multiple catalog entries identify the Meadowlight Lamp as a standard office desk lamp"

  - id: quote_copies_expanded_agent_short_term_3
    claim: "verbatim"
    context: "quotation from an agent answer"
    status: verified
    source: "results/20261111T161252Z/copies-expanded-agent-short_term-3.json"
