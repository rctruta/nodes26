# Single source of truth for load-bearing claims in this project.
#
# Nothing goes into an outward-facing document - README, site, paper, resume,
# application - unless it is registered here with a source that can be checked.
#
# status: verified   - checked against a source, with the check recorded below
#         reported   - human testimony; true, but no external artifact
#         unverified - NOT for outward-facing use
#
#   python3 .gates/verify.py           check registered facts against sources
#   python3 .gates/scan.py             find banned claims + unregistered numbers
#
# check types: grep (default) | dircount | shell | url_contains
#
# --- EXAMPLES (uncomment and edit; delete what you don't use) ---------------
#
# facts:
#   - id: throughput_10m
#     claim: "13.2x"
#     context: "engine A vs engine B at 10M rows"
#     status: verified
#     source: docs/results.md
#     grep: "13.2"
#
#   - id: upstream_issues
#     claim: "#369, #370"
#     context: "defects reported upstream, authored by us"
#     status: verified
#     source: "gh search issues --repo owner/repo --author me --json number"
#     check: shell
#     expect: "369"
#
#   - id: headcount
#     claim: "1,400+"
#     context: "a fact only a human can attest to"
#     status: reported

facts:
  - id: run_commit
    claim: "2c01a5a"
    context: "published run: producing commit and clean tree"
    status: verified
    source: "results/20261111T161252Z/analysis.md"
    grep: "commit `2c01a5a0a04c350020b561f67080887dc82fd029`, clean tree"

  - id: library_version
    claim: "0.8.0"
    context: "installed neo4j-agent-memory version in the run"
    status: verified
    source: "python3 -m claim_trace.facts results/20261111T161252Z 'independently certified'"
    check: shell
    expect: "library_version: 0.8.0"

  - id: control_row
    claim: "rank 4, 0.7367; rank 2, 0.8197"
    context: "control entity: type, sources, entity and message search"
    status: verified
    source: "results/20261111T161252Z/analysis.md"
    grep: "| control | base | Harbor Task Lamp | OBJECT | 1 | 11 | 0 | 4 / 0.7367 | 2 / 0.8197 |"

  - id: single_row
    claim: "rank 4, 0.7488; rank 1, 0.8711"
    context: "fabricated entity: type, sources, entity and message search"
    status: verified
    source: "results/20261111T161252Z/analysis.md"
    grep: "| single | base | Meadowlight Lamp | OBJECT | 1 | 11 | 1 | 4 / 0.7488 | 1 / 0.8711 |"

  - id: copies_expanded_row
    claim: "4 linked messages, rank 4, 0.7488"
    context: "copies arm after repetition"
    status: verified
    source: "results/20261111T161252Z/analysis.md"
    grep: "| copies | expanded | Meadowlight Lamp | OBJECT | 4 | 11 | 1 | 4 / 0.7488 | 1 / 0.8711 |"

  - id: distinct_expanded_row
    claim: "4 linked messages, 15 entities"
    context: "distinct arm after independent statements"
    status: verified
    source: "results/20261111T161252Z/analysis.md"
    grep: "| distinct | expanded | Meadowlight Lamp | OBJECT | 4 | 15 | 1 | 4 / 0.7488 | 1 / 0.8711 |"

  - id: copies_unchanged
    claim: "1 to 4"
    context: "copies arm: same node, embedding, score, rank; no new entities"
    status: verified
    source: "results/20261111T161252Z/analysis.md"
    grep: "- copies: sources 1 to 4; same node: True; same embedding: True; same score: True; same rank: True; new entities: none."

  - id: distinct_unchanged
    claim: "1 to 4"
    context: "distinct arm: same node, embedding, score, rank; four new entities"
    status: verified
    source: "results/20261111T161252Z/analysis.md"
    grep: "- distinct: sources 1 to 4; same node: True; same embedding: True; same score: True; same rank: True; new entities: office desks, procurement handbook, task light, workplace catalog."

  - id: embedding_hash
    claim: "b3d1ad15b57b67a3"
    context: "target entity embedding hash prefix"
    status: verified
    source: "results/20261111T161252Z/single-base-entity_search.json"
    grep: "b3d1ad15b57b67a3"

  - id: score_gap
    claim: "0.012"
    context: "fabricated minus control entity similarity"
    status: verified
    source: "python3 -m claim_trace.facts results/20261111T161252Z 'independently certified'"
    check: shell
    expect: "score_gap: 0.012"

  - id: ranked_above
    claim: "3"
    context: "generic category nodes ranked above the fabricated entity"
    status: verified
    source: "python3 -m claim_trace.facts results/20261111T161252Z 'independently certified'"
    check: shell
    expect: "ranked_above: desk lamp, adjustable desk lamps, task lamps"

  - id: entity_trials
    claim: "11 of the 12"
    context: "entity-memory trials with the product in a tool result and in the answer"
    status: verified
    source: "python3 -m claim_trace.facts results/20261111T161252Z 'independently certified'"
    check: shell
    expect: "long_term_trials: 11 of 12 in tool result and answer, 11 in either"

  - id: message_trials
    claim: "12"
    context: "message-memory trials with the product in a tool result and in the answer"
    status: verified
    source: "python3 -m claim_trace.facts results/20261111T161252Z 'independently certified'"
    check: shell
    expect: "short_term_trials: 12 of 12 in tool result and answer, 12 in either"

  - id: trial_total
    claim: "24"
    context: "agent trials in the run"
    status: verified
    source: "python3 -m claim_trace.facts results/20261111T161252Z 'independently certified'"
    check: shell
    expect: "trial_files: 24"

  - id: certified_repeated
    claim: "9"
    context: "fabricated-claim message-memory answers containing the phrase"
    status: verified
    source: "python3 -m claim_trace.facts results/20261111T161252Z 'independently certified'"
    check: shell
    expect: "phrase_in_claim_arm_message_answers: 9 of 9"

  - id: token_usage
    claim: "12,283 input and 39,334 output"
    context: "total agent-trial token usage"
    status: verified
    source: "python3 -m claim_trace.facts results/20261111T161252Z 'independently certified'"
    check: shell
